<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Macros & Gym Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .hidden { display: none !important; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #3b82f6; background-color: #eff6ff; }
        .tab-inactive { color: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-24">

    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-lg flex items-center gap-2 transition-all opacity-0 pointer-events-none text-white text-sm font-medium">
        <i id="toast-icon" class="fa-solid fa-circle-info"></i>
        <span id="toast-msg"></span>
    </div>

    <header class="bg-slate-900 text-white pt-10 pb-6 px-6 rounded-b-3xl shadow-md sticky top-0 z-40 flex justify-between items-center">
        <div class="max-w-md mx-auto w-full flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-heart-pulse text-blue-400 text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">SquadTracker</h1>
                    <p class="text-slate-400 text-xs">Macros & Gym</p>
                </div>
            </div>
            <button id="btn-edit-profile" class="bg-slate-800 p-2 rounded-full text-slate-300 hover:text-white hidden">
                <i class="fa-solid fa-user"></i>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6 space-y-6">
        
        <section id="section-profile" class="bg-white p-5 rounded-2xl shadow-sm border border-blue-100 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
            <h2 class="text-lg font-bold mb-4 text-slate-800"><i class="fa-solid fa-bullseye text-blue-500 mr-2"></i> Tu Perfil y Meta</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Nombre en el Squad</label>
                    <input type="text" id="input-name" placeholder="Ej: Fredy o Charli" class="w-full p-3 mt-1 bg-slate-50 rounded-xl border border-slate-200 focus:border-blue-400 outline-none font-bold">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Meta Diaria de Calorías</label>
                    <input type="number" id="input-target" placeholder="Ej: 2200" class="w-full p-3 mt-1 bg-slate-50 rounded-xl border border-slate-200 focus:border-blue-400 outline-none font-mono">
                </div>
                <button id="btn-save-profile" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors">Guardar Perfil</button>
            </div>
        </section>

        <div id="main-content" class="hidden space-y-6">
            
            <button id="btn-gym" class="w-full flex justify-center items-center gap-2 py-4 rounded-2xl font-bold text-white bg-orange-500 shadow-sm hover:bg-orange-600 active:scale-95 transition-all">
                <i class="fa-solid fa-dumbbell"></i> <span id="btn-gym-text">Registrar Gym Hoy</span>
            </button>

            <section class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="flex border-b border-slate-100">
                    <button id="tab-btn-recipe" class="flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-active transition-colors">
                        <i class="fa-solid fa-scale-balanced"></i> Pesos Exactos
                    </button>
                    <button id="tab-btn-ai" class="flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-inactive transition-colors">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> IA Visual
                    </button>
                </div>

                <div class="p-4">
                    <div id="tab-content-recipe" class="space-y-3">
                        <input type="text" id="recipe-name" placeholder="Nombre (ej: Pollo c/ Arroz)" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:border-blue-400 outline-none text-sm font-bold text-slate-700">
                        <textarea id="recipe-ingredients" rows="3" placeholder="Ej: 150g pechuga pollo&#10;100g arroz blanco" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:border-blue-400 outline-none text-sm font-mono"></textarea>
                        <button id="btn-submit-recipe" class="w-full flex justify-center items-center gap-2 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">
                            <i class="fa-solid fa-calculator"></i> Calcular Desglose
                        </button>
                    </div>

                    <div id="tab-content-ai" class="hidden space-y-3">
                        <textarea id="ai-text" rows="2" placeholder="Describe tu comida o sube foto" class="w-full p-3 bg-slate-50 rounded-xl border border-slate-200 focus:border-emerald-400 outline-none text-sm"></textarea>
                        
                        <div id="image-preview-container" class="hidden relative rounded-xl overflow-hidden bg-slate-100">
                            <img id="image-preview" src="" class="w-full h-32 object-cover" alt="Preview">
                            <button id="btn-clear-image" class="absolute top-2 right-2 bg-black/50 text-white p-2 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>

                        <div class="flex gap-2">
                            <button id="btn-trigger-file" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl flex justify-center items-center gap-2 font-medium">
                                <i class="fa-solid fa-camera"></i> Foto
                            </button>
                            <input type="file" id="file-input" accept="image/*" class="hidden" capture="environment">
                            <button id="btn-submit-ai" class="flex-[2] bg-emerald-600 text-white py-3 rounded-xl flex justify-center items-center gap-2 font-bold hover:bg-emerald-700">
                                <i class="fa-solid fa-wand-magic-sparkles"></i> Estimar
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 ml-2 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-500"></i> Tablero del Squad
                </h2>
                <div id="daily-summary-container" class="grid grid-cols-1 gap-3">
                    <p class="text-center text-slate-400 py-4 text-sm">Cargando métricas...</p>
                </div>
            </section>

            <section>
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-3 ml-2">Historial en Vivo</h2>
                <div id="feed-container" class="space-y-4">
                    <p class="text-center text-slate-400 py-4 text-sm">Cargando registros...</p>
                </div>
            </section>

        </div>
    </main>

    <script>
        // ==========================================
        // CONFIGURACIÓN API
        // ==========================================
        const SHEET_URL = "https://api.sheetbest.com/sheets/f5ad3a5a-e31f-496d-9817-d340a88fe9af";
        const GEMINI_API_KEY = "AIzaSyBbAqHJmR15HpBIv_XxjTLagqQBlr1EPKs";

        const TAB_PERFILES = `${SHEET_URL}/tabs/perfiles`;
        const TAB_COMIDAS = `${SHEET_URL}/tabs/comidas`;
        const TAB_GYM = `${SHEET_URL}/tabs/gym`;

        // Variables Globales de Estado
        let currentUser = localStorage.getItem('squadName') || '';
        let currentTarget = localStorage.getItem('calorieTarget') || '2000';
        
        let rawMeals = [];
        let rawGym = [];
        let rawProfiles = {};
        
        let selectedImageBase64 = null;
        let selectedMimeType = null;
        let expandedBreakdowns = {};

        // DOM Elements
        const secProfile = document.getElementById('section-profile');
        const mainContent = document.getElementById('main-content');
        const inputName = document.getElementById('input-name');
        const inputTarget = document.getElementById('input-target');
        const btnEditProfile = document.getElementById('btn-edit-profile');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const toastIcon = document.getElementById('toast-icon');
        const feedContainer = document.getElementById('feed-container');
        const dailySummaryContainer = document.getElementById('daily-summary-container');
        const btnGym = document.getElementById('btn-gym');

        // Utilidad: Notificaciones
        function showToast(msg, type = "info") {
            toastMsg.innerText = msg;
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-full shadow-lg flex items-center gap-2 transition-all text-white text-sm font-medium ${type === 'error' ? 'bg-red-500' : 'bg-emerald-500'}`;
            toastIcon.className = type === 'error' ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-check';
            setTimeout(() => { toast.classList.add('opacity-0'); toast.classList.add('pointer-events-none'); }, 3000);
        }

        // --- MANEJO DE PERFIL ---
        function checkProfile() {
            if (currentUser) {
                secProfile.classList.add('hidden');
                mainContent.classList.remove('hidden');
                btnEditProfile.classList.remove('hidden');
                fetchAllData(); // Cargar info automáticamente
            } else {
                secProfile.classList.remove('hidden');
                mainContent.classList.add('hidden');
                btnEditProfile.classList.add('hidden');
            }
        }
        
        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            const name = inputName.value.trim();
            const target = parseInt(inputTarget.value);
            if (!name || !target || target < 500) return showToast("Datos inválidos", "error");
            
            const btn = document.getElementById('btn-save-profile');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
            
            try {
                // Verificar si existe el perfil en local. Si existe, actualizamos usando PATCH, si no, POST
                if (rawProfiles.hasOwnProperty(name)) {
                    await fetch(`${TAB_PERFILES}/nombre/${name}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ meta_calorias: target })
                    });
                } else {
                    await fetch(TAB_PERFILES, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify([{ nombre: name, meta_calorias: target }])
                    });
                }
                
                localStorage.setItem('squadName', name);
                localStorage.setItem('calorieTarget', target);
                currentUser = name;
                currentTarget = target;
                
                showToast("¡Perfil guardado!", "success");
                checkProfile();
            } catch (e) {
                showToast("Error guardando perfil", "error");
            }
            btn.innerHTML = 'Guardar Perfil';
        });

        btnEditProfile.addEventListener('click', () => {
            inputName.value = currentUser;
            inputTarget.value = currentTarget;
            currentUser = ''; // Forzar mostrar pantalla
            checkProfile();
        });
        
        inputName.value = currentUser;
        inputTarget.value = currentTarget;
        checkProfile();

        // --- SISTEMA DE PESTAÑAS ---
        const tabRecipe = document.getElementById('tab-btn-recipe');
        const tabAI = document.getElementById('tab-btn-ai');
        const contRecipe = document.getElementById('tab-content-recipe');
        const contAI = document.getElementById('tab-content-ai');

        tabRecipe.addEventListener('click', () => {
            tabRecipe.className = "flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-active transition-colors";
            tabAI.className = "flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-inactive transition-colors hover:bg-slate-50";
            contRecipe.classList.remove('hidden');
            contAI.classList.add('hidden');
        });

        tabAI.addEventListener('click', () => {
            tabAI.className = "flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-active transition-colors text-emerald-600 border-emerald-500 bg-emerald-50 border-b-2";
            tabRecipe.className = "flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 tab-inactive transition-colors hover:bg-slate-50";
            contAI.classList.remove('hidden');
            contRecipe.classList.add('hidden');
        });

        // --- MANEJO DE IMÁGENES ---
        const fileInput = document.getElementById('file-input');
        const imgPreviewContainer = document.getElementById('image-preview-container');
        const imgPreview = document.getElementById('image-preview');

        document.getElementById('btn-trigger-file').addEventListener('click', () => fileInput.click());
        document.getElementById('btn-clear-image').addEventListener('click', clearImageFunc);

        function clearImageFunc() {
            fileInput.value = '';
            selectedImageBase64 = null;
            selectedMimeType = null;
            imgPreviewContainer.classList.add('hidden');
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height = height * (MAX_WIDTH / width); width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const resizedUrl = canvas.toDataURL(file.type);
                    
                    selectedMimeType = resizedUrl.split(';')[0].split(':')[1];
                    selectedImageBase64 = resizedUrl.split(',')[1];
                    imgPreview.src = resizedUrl;
                    imgPreviewContainer.classList.remove('hidden');
                };
            };
        });

        // --- LLAMADAS A GEMINI ---
        async function fetchGemini(promptText, isVisual = false) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            let parts = [{ text: promptText }];
            
            if (isVisual && selectedImageBase64) {
                parts.push({ inlineData: { mimeType: selectedMimeType, data: selectedImageBase64 } });
            }
            
            const payload = {
                contents: [{ role: "user", parts: parts }],
                generationConfig: { responseMimeType: "application/json" }
            };
            
            const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            if(!res.ok) throw new Error("Error en API");
            const data = await res.json();
            return JSON.parse(data.candidates[0].content.parts[0].text);
        }

        // --- GUARDAR RECETA EXACTA ---
        document.getElementById('btn-submit-recipe').addEventListener('click', async () => {
            const name = document.getElementById('recipe-name').value;
            const ings = document.getElementById('recipe-ingredients').value;
            if(!name || !ings) return showToast("Llena los campos", "error");
            
            const btn = document.getElementById('btn-submit-recipe');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Calculando...';
            btn.disabled = true;

            const prompt = `Calcula macros precisos para: ${ings}. Responde SOLO JSON con desgloses. Estructura exacta obligatoria: { "total_calories": 0, "total_protein": 0, "total_carbs": 0, "total_fats": 0, "ingredients_breakdown": [{"name": "ingrediente", "calories": 0, "protein": 0, "carbs": 0, "fats": 0}] }`;

            try {
                const parsedData = await fetchGemini(prompt);
                
                await fetch(TAB_COMIDAS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([{
                        timestamp: Date.now(),
                        usuario: currentUser,
                        comida: name.trim(),
                        calorias: parsedData.total_calories,
                        proteina: parsedData.total_protein,
                        carbos: parsedData.total_carbs,
                        grasas: parsedData.total_fats,
                        tipo_entrada: 'recipe_exact',
                        desglose: JSON.stringify(parsedData.ingredients_breakdown)
                    }])
                });

                document.getElementById('recipe-name').value = '';
                document.getElementById('recipe-ingredients').value = '';
                showToast("¡Receta guardada!", "success");
                fetchAllData(); // Refrescar en tiempo real
            } catch (e) {
                showToast("Error calculando. Revisa tu lista.", "error");
            }
            btn.innerHTML = '<i class="fa-solid fa-calculator"></i> Calcular Desglose';
            btn.disabled = false;
        });

        // --- GUARDAR CON IA VISUAL ---
        document.getElementById('btn-submit-ai').addEventListener('click', async () => {
            const text = document.getElementById('ai-text').value;
            if(!text && !selectedImageBase64) return showToast("Escribe algo o sube foto", "error");
            
            const btn = document.getElementById('btn-submit-ai');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Estimando...';
            btn.disabled = true;

            const prompt = `Actúa como nutricionista. Estima macros para: ${text}. Responde SOLO JSON. Estructura: { "food_name": "Nombre", "calories": 0, "protein": 0, "carbs": 0, "fats": 0 }`;

            try {
                const macros = await fetchGemini(prompt, true);
                
                await fetch(TAB_COMIDAS, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([{
                        timestamp: Date.now(),
                        usuario: currentUser,
                        comida: macros.food_name || text || "Comida por foto",
                        calorias: macros.calories,
                        proteina: macros.protein,
                        carbos: macros.carbs,
                        grasas: macros.fats,
                        tipo_entrada: 'ai_visual',
                        desglose: "[]"
                    }])
                });

                document.getElementById('ai-text').value = '';
                clearImageFunc();
                showToast("¡Comida registrada!", "success");
                fetchAllData(); // Refrescar en tiempo real
            } catch (e) {
                showToast("Error estimando. Intenta de nuevo.", "error");
            }
            btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Estimar';
            btn.disabled = false;
        });

        // --- GYM CHECKIN ---
        btnGym.addEventListener('click', async () => {
            btnGym.disabled = true;
            btnGym.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                await fetch(TAB_GYM, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([{
                        timestamp: Date.now(),
                        usuario: currentUser
                    }])
                });

                showToast("¡Gym registrado, a crecer esos músculos!", "success");
                fetchAllData(); // Refrescar en tiempo real
            } catch (e) {
                showToast("Error al registrar gym", "error");
            }
            btnGym.disabled = false;
        });

        // ========================================================
        // --- RECUPERAR DATOS DE SHEETBEST (SIMULAR ONSNAPSHOT) ---
        // ========================================================
        async function fetchAllData() {
            if(!currentUser) return;

            try {
                const [resPerfiles, resComidas, resGym] = await Promise.all([
                    fetch(TAB_PERFILES),
                    fetch(TAB_COMIDAS),
                    fetch(TAB_GYM)
                ]);
                
                const p = await resPerfiles.json();
                const c = await resComidas.json();
                const g = await resGym.json();

                // Procesar Perfiles
                rawProfiles = {};
                if (Array.isArray(p)) {
                    p.forEach(row => rawProfiles[row.nombre] = parseInt(row.meta_calorias) || 2000);
                }

                // Procesar Comidas
                rawMeals = [];
                if (Array.isArray(c)) {
                    rawMeals = c.map((row, i) => {
                        let parsedBreakdown = [];
                        try { parsedBreakdown = JSON.parse(row.desglose); } catch(e) {}
                        
                        return {
                            id: `meal_${i}_${row.timestamp}`,
                            userName: row.usuario,
                            foodName: row.comida,
                            calories: parseInt(row.calorias) || 0,
                            protein: parseInt(row.proteina) || 0,
                            carbs: parseInt(row.carbos) || 0,
                            fats: parseInt(row.grasas) || 0,
                            entryType: row.tipo_entrada,
                            timestamp: parseInt(row.timestamp) || 0,
                            breakdown: parsedBreakdown
                        }
                    });
                }

                // Procesar Gym
                rawGym = [];
                if (Array.isArray(g)) {
                    rawGym = g.map((row, i) => ({
                        id: `gym_${i}_${row.timestamp}`,
                        userName: row.usuario,
                        timestamp: parseInt(row.timestamp) || 0
                    }));
                }

                renderAll();
            } catch (error) {
                console.error("Error obteniendo datos de SheetBest:", error);
            }
        }

        // Simular actualizaciones en tiempo real (consultar la DB cada 10 segundos)
        setInterval(fetchAllData, 10000);


        // Funcion global para alternar el menú de ingredientes de las recetas
        window.toggleBreakdown = function(id) {
            expandedBreakdowns[id] = !expandedBreakdowns[id];
            renderAll();
        }

        function renderAll() {
            if (!currentUser) return;
            
            const todayStart = new Date(); todayStart.setHours(0,0,0,0);
            const weekStart = new Date(todayStart); weekStart.setDate(todayStart.getDate() - todayStart.getDay() + (todayStart.getDay() === 0 ? -6 : 1));

            const stats = {};
            Object.keys(rawProfiles).forEach(name => {
                stats[name] = { cal: 0, prot: 0, carb: 0, target: rawProfiles[name], gymToday: false, gymWeek: 0 };
            });
            
            if(!stats[currentUser]) stats[currentUser] = { cal:0, prot:0, carb:0, target:currentTarget, gymToday:false, gymWeek:0 };

            rawMeals.filter(m => m.timestamp >= todayStart.getTime()).forEach(m => {
                const n = m.userName;
                if(!stats[n]) stats[n] = { cal:0, prot:0, carb:0, target:2000, gymToday:false, gymWeek:0 };
                stats[n].cal += m.calories || 0;
                stats[n].prot += m.protein || 0;
                stats[n].carb += m.carbs || 0;
            });

            rawGym.forEach(g => {
                const n = g.userName;
                if(stats[n]) {
                    if(g.timestamp >= todayStart.getTime()) stats[n].gymToday = true;
                    if(g.timestamp >= weekStart.getTime()) stats[n].gymWeek++;
                }
            });

            const miGymHoy = stats[currentUser]?.gymToday;
            if (miGymHoy) {
                btnGym.className = "w-full flex justify-center items-center gap-2 py-4 rounded-2xl font-bold text-white bg-slate-800 shadow-sm opacity-90 cursor-not-allowed";
                btnGym.innerHTML = '<i class="fa-solid fa-circle-check"></i> Entrenaste Hoy';
                btnGym.disabled = true;
            } else {
                btnGym.className = "w-full flex justify-center items-center gap-2 py-4 rounded-2xl font-bold text-white bg-orange-500 shadow-sm hover:bg-orange-600 active:scale-95 transition-all";
                btnGym.innerHTML = '<i class="fa-solid fa-dumbbell"></i> Registrar Gym Hoy';
                btnGym.disabled = false;
            }

            let htmlSummary = '';
            Object.entries(stats).sort((a,b) => b[1].gymToday - a[1].gymToday).forEach(([name, data]) => {
                const isMe = name === currentUser;
                const pct = Math.min(100, Math.round((data.cal / data.target) * 100));
                let barCol = "bg-emerald-500";
                if(pct > 110) barCol = "bg-red-500"; else if(pct < 50 && data.cal > 0) barCol = "bg-amber-400";
                
                htmlSummary += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border ${isMe ? 'border-blue-200 ring-1 ring-blue-50' : 'border-slate-100'}">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800">${isMe ? 'Tú' : name}</span>
                                ${data.gymToday ? '<span class="bg-orange-100 text-orange-700 text-[10px] px-2 py-0.5 rounded-full font-bold flex items-center gap-1"><i class="fa-solid fa-dumbbell text-[8px]"></i> Entrenó</span>' : ''}
                            </div>
                            <div class="text-[10px] text-slate-400 font-bold flex items-center gap-1">
                                <i class="fa-regular fa-calendar"></i> ${data.gymWeek} días al gym (Semana)
                            </div>
                        </div>
                        <div class="mb-2 relative">
                            <div class="flex justify-between text-xs mb-1 font-bold">
                                <span class="${pct > 105 ? 'text-red-500' : 'text-slate-600'}">${data.cal} kcal consumidas</span>
                                <span class="text-slate-400">Meta: ${data.target}</span>
                            </div>
                            <div class="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full ${barCol} transition-all duration-1000" style="width: ${pct}%"></div>
                            </div>
                        </div>
                        <div class="flex justify-start gap-3 mt-3 text-xs font-bold text-slate-500">
                            <span class="bg-blue-50 text-blue-700 px-2 py-1 rounded">Prot: ${data.prot}g</span>
                            <span class="bg-amber-50 text-amber-700 px-2 py-1 rounded">Carb: ${data.carb}g</span>
                        </div>
                    </div>`;
            });
            dailySummaryContainer.innerHTML = htmlSummary || '<p class="text-center text-slate-400 py-4 text-sm">Sin datos hoy.</p>';

            let feedItems = [
                ...rawMeals.map(m => ({...m, type: 'meal'})),
                ...rawGym.map(g => ({...g, type: 'gym'}))
            ].sort((a,b) => b.timestamp - a.timestamp);

            let htmlFeed = '';
            feedItems.forEach(item => {
                const isMe = item.userName === currentUser;
                const time = new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                if (item.type === 'gym') {
                    htmlFeed += `
                        <div class="bg-orange-50 border border-orange-100 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                               <div class="bg-orange-500 text-white p-2 rounded-full w-8 h-8 flex items-center justify-center"><i class="fa-solid fa-dumbbell text-xs"></i></div>
                               <div><p class="text-sm font-bold text-slate-800">${isMe ? 'Tú' : item.userName} <span class="text-orange-600 font-normal">acaba de registrar el templo.</span></p></div>
                            </div>
                            <span class="text-xs text-orange-400 font-bold">${time}</span>
                        </div>`;
                } else {
                    const isExact = item.entryType === 'recipe_exact';
                    const expanded = expandedBreakdowns[item.id];
                    let bdHtml = '';
                    
                    if (isExact && item.breakdown && item.breakdown.length > 0) {
                        bdHtml = `
                        <div class="mt-2 border-t border-slate-50 pt-2">
                            <button onclick="toggleBreakdown('${item.id}')" class="w-full text-xs font-bold text-slate-400 hover:text-slate-600 flex justify-center items-center gap-1">
                                ${expanded ? 'Ocultar Receta <i class="fa-solid fa-chevron-up"></i>' : 'Ver Receta Detallada <i class="fa-solid fa-chevron-down"></i>'}
                            </button>
                            ${expanded ? `
                            <div class="mt-2 space-y-1">
                                ${item.breakdown.map(ing => `
                                    <div class="flex justify-between items-center bg-slate-50 px-2 py-1.5 rounded text-xs">
                                        <span class="font-medium text-slate-700 w-2/3 truncate">${ing.name || 'Ingrediente'}</span>
                                        <div class="flex gap-2 font-mono text-[10px] text-slate-500">
                                            <span class="text-blue-500">P:${ing.protein}</span><span>${ing.calories}c</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>` : ''}
                        </div>`;
                    }

                    htmlFeed += `
                        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-2">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs ${isMe ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">
                                        ${item.userName.charAt(0).toUpperCase()}
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-800 flex items-center gap-1">
                                            ${isMe ? 'Tú' : item.userName}
                                            ${isExact ? '<i class="fa-solid fa-scale-balanced text-blue-500 text-[10px]" title="Exacto"></i>' : '<i class="fa-solid fa-wand-magic-sparkles text-emerald-500 text-[10px]"></i>'}
                                        </p>
                                        <p class="text-xs text-slate-400">${time}</p>
                                    </div>
                                </div>
                                <span class="px-2 py-1 rounded-md text-xs font-bold border ${isExact ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}">
                                    ${item.calories} kcal
                                </span>
                            </div>
                            <p class="text-sm text-slate-700 font-bold mb-3">${item.foodName}</p>
                            <div class="flex gap-1.5 mb-2">
                                <div class="flex-1 bg-slate-50 rounded p-1.5 text-center border border-slate-100">
                                    <div class="text-[9px] text-blue-500 font-bold uppercase">Prot</div>
                                    <div class="text-xs font-bold text-slate-700">${item.protein}g</div>
                                </div>
                                <div class="flex-1 bg-slate-50 rounded p-1.5 text-center border border-slate-100">
                                    <div class="text-[9px] text-amber-600 font-bold uppercase">Carb</div>
                                    <div class="text-xs font-bold text-slate-700">${item.carbs}g</div>
                                </div>
                                <div class="flex-1 bg-slate-50 rounded p-1.5 text-center border border-slate-100">
                                    <div class="text-[9px] text-rose-500 font-bold uppercase">Grasa</div>
                                    <div class="text-xs font-bold text-slate-700">${item.fats}g</div>
                                </div>
                            </div>
                            ${bdHtml}
                        </div>`;
                }
            });
            feedContainer.innerHTML = htmlFeed || '<p class="text-center text-slate-400 py-4 text-sm">El timeline está vacío.</p>';
        }
    </script>
</body>
</html>
